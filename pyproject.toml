[project]
name = "lighthouse"
version = "0.0.0"
description = "Personal agent system on a home server"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "anthropic>=0.80",
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "langchain-litellm>=0.11.2",
    "langfuse>=5.2.0",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-postgres>=3.2.0",
    "litellm>=1.108.3",
    "psycopg[binary,pool]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.0",
    "sse-starlette>=3.7.0",
    "trafilatura>=2.3.1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lighthouse"]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
include = ["src", "tests", "playground"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "session"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]
