name: CI

on:
  push:
  pull_request:

# The jobs only read the repository.
permissions:
  contents: read

# A newer push to the same branch cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    # The tests need a Postgres with pgvector and nothing else: no model API keys, no Supabase.
    # tests/conftest.py creates a throwaway database on this server for each run.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no moving major tag, so this one is pinned to an exact release.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      # --locked: fail if uv.lock does not match pyproject.toml instead of silently updating it.
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run --no-sync ruff check
      - name: Format check
        run: uv run --no-sync ruff format --check
      - name: Type check
        run: uv run --no-sync basedpyright
      - name: Tests
        run: uv run --no-sync pytest

  web:
    name: Web (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      # pnpm version comes from the "packageManager" field in web/package.json.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm build

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Every commit, not just the latest: a secret removed in a later commit is still public.
          fetch-depth: 0
      - name: Scan
        run: >-
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1
          git /repo --redact --verbose
